[package]
name = "musix"
version = "0.1.0"
description = "A sleek vinyl-inspired desktop audio player"
authors = ["Yash Thorat"]
edition = "2021"

[lib]
name = "musix_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
audiotags = "0.5.0"
base64 = "0.22.1"
id3 = "1.16.4"
symphonia = { version = "0.5.3", features = ["mp3", "aac", "wav", "flac"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
rfd = "0.18.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

