<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>NeutralinoJs sample app</title>
    <link rel="stylesheet" href="/styles.css">
    <script defer src="/js/neutralino.js"></script>
    <script defer src="/js/main.js"></script>
  </head>
  <body>
    <div id="main-wrapper">
      <div id="player-screen">
        <!-- <img src="/icons/MUSIX/maximized__active.png" alt="refernce" id="reference"> -->
        <img src="/icons/MUSIX/maximised.png" alt="reference" id="reference">
        <div id="disc-wrapper">
          <div id="disc">
            <img src="/icons/image1.png" id="disc-image">
          </div>
          <div id="disc-inner"></div>
          <div id="disc-center"></div>
        </div>
        <div id="hand-wrapper">
          <svg id="hand">
              <polyline points="39,5 39,95 0,120" fill="none" stroke="#D6D6D6" stroke-width="6" />
          </svg>
          <div id="hand-head"></div>
        </div>
        <div id="close-wrapper">
          <button id="close-button" class="close">
            <div id="close-button-inner"></div>
          </button>
        </div>
        

      </div>
    </div>
  </body>
</html>
